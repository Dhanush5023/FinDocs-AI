version: '3.8'

services:
  findocs-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: findocs_api_service
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3